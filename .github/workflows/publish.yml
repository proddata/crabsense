name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - run: npm --prefix demo ci
      - run: npm run demo:test
      - run: npm run demo:build
      - run: npm publish
